<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Our Glamping Countdown</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Gloock&family=Nanum+Pen+Script&display=swap">
<style>
  /* Layout: one dusk campsite fills the page. Words sit in the dark upper sky, the scene owns the bottom. */
  :root {
    color-scheme: dark;
    --night: #10162f;
    --cream: #fdf1dc;
    --haze: #d6cbe2;
    --lantern: #ffd27a;
    --display: "Gloock", Georgia, "Times New Roman", serif;
    --hand: "Nanum Pen Script", "Segoe Print", "Bradley Hand", cursive;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --scene: clamp(250px, 38vh, 460px);
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--night); color: var(--cream); font-family: var(--body); line-height: 1.5; }
  [hidden] { display: none !important; }

  .stage { position: relative; min-height: 100%; isolation: isolate; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; }

  .copy {
    box-sizing: border-box;
    width: 100%;
    max-width: 1120px;
    margin-inline: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: clamp(24px, 5vh, 64px) var(--scene);
    display: grid;
    gap: clamp(12px, 2vh, 20px);
  }

  .when { margin: 0; font-size: .8rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--lantern); }
  .local { margin: 4px 0 0; font-size: .9rem; color: var(--haze); }

  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(1.9rem, 5vw, 3.2rem); line-height: 1.1; text-wrap: balance; }

  .timer { display: flex; flex-wrap: wrap; gap: 0 clamp(10px, 3vw, 44px); }
  .unit { display: grid; gap: 2px; }
  .num { font-family: var(--display); font-size: clamp(2.4rem, min(13.5vw, 19vh), 8.5rem); line-height: 1; font-variant-numeric: lining-nums; white-space: nowrap; }
  /* Each digit gets a fixed slot so the row holds still as the seconds tick. */
  .num i { display: inline-block; width: .64em; text-align: center; font-style: normal; }
  .label { font-size: .72rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--haze); }

  .note { margin: 0; max-width: 34em; font-family: var(--hand); font-size: clamp(1.45rem, 2.6vw, 1.85rem); line-height: 1.15; }
  .note strong { font-weight: 400; color: var(--lantern); }

  /* The 5 PM surprise. None of this shows until the countdown reaches zero. */
  #sparks { position: fixed; z-index: 2; pointer-events: none; }
  .copy { position: relative; z-index: 1; }
  .arrived h1 { font-size: clamp(2.7rem, 10.5vw, 6.5rem); line-height: 1; color: var(--lantern); animation: pop .9s cubic-bezier(.2, 1.4, .4, 1) backwards; }
  .hint { margin: 0; font-size: .85rem; color: var(--haze); }

  .photos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: dense; gap: clamp(12px, 2.5vw, 24px); margin-top: 10px; }
  @media (min-width: 760px) { .photos { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .print {
    appearance: none;
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    margin: 0;
    padding: 7px 7px 24px;
    border: 0;
    border-radius: 2px;
    background: var(--cream);
    box-shadow: 0 14px 30px rgba(6, 8, 24, .55);
    cursor: zoom-in;
    transform: rotate(var(--tilt));
    transition: transform .2s;
    animation: deal .8s cubic-bezier(.2, .9, .3, 1.1) backwards;
    animation-delay: var(--delay);
  }
  .print:hover, .print:focus-visible { transform: rotate(0deg) scale(1.03); z-index: 2; }
  .print:focus-visible { outline: 2px solid var(--lantern); outline-offset: 3px; }
  .print img { display: block; width: 100%; flex: 1 1 auto; min-height: 0; aspect-ratio: 4 / 5; object-fit: cover; }
  .print.wide { grid-column: span 2; }
  .print.wide img { aspect-ratio: 8 / 5; }
  .print.strip { grid-row: span 2; padding: 0; background: #0b0b0b; }
  .print.strip img { position: absolute; inset: 0; height: 100%; aspect-ratio: auto; object-fit: contain; }

  .viewer { padding: 0; border: 0; background: transparent; max-width: 92vw; max-height: 90vh; overflow: hidden; cursor: zoom-out; }
  .viewer::backdrop { background: rgba(6, 8, 24, .88); }
  .viewer img { display: block; max-width: 100%; max-height: 90vh; border: 7px solid var(--cream); box-sizing: border-box; }

  @keyframes pop { from { opacity: 0; transform: scale(.7); } }
  @keyframes deal { from { opacity: 0; transform: translateY(70px) rotate(calc(var(--tilt) * 6)) scale(.8); } }
  @media (prefers-reduced-motion: reduce) {
    .arrived h1, .print { animation: none; }
    .print { transition: none; }
  }
</style>

<main class="stage" id="stage">
  <canvas id="scene" aria-hidden="true"></canvas>
  <canvas id="sparks" aria-hidden="true" hidden></canvas>
  <div class="copy" id="copy">
    <div>
      <p class="when">Saturday, Nov 7 &middot; 5 PM</p>
      <p class="local" id="local" hidden></p>
    </div>
    <h1 id="headline">Until I see you</h1>
    <div class="timer" id="timer" role="timer">
      <div class="unit" id="unit-d"><span class="num" id="d">00</span><span class="label" id="label-d">days</span></div>
      <div class="unit"><span class="num" id="h">00</span><span class="label" id="label-h">hours</span></div>
      <div class="unit"><span class="num" id="m">00</span><span class="label" id="label-m">minutes</span></div>
      <div class="unit"><span class="num" id="s">00</span><span class="label" id="label-s">seconds</span></div>
    </div>
    <p class="note"><strong id="sleeps"></strong> <span id="message">I miss you too. The two little lights down there are us.</span></p>
    <p class="hint" id="hint" hidden>Tap the sky for more fireworks.</p>
    <div class="photos" id="photos" hidden></div>
  </div>
</main>
<dialog class="viewer" id="viewer"><img id="viewer-img" alt=""></dialog>

<script>
(function () {
  const TARGET = new Date('2026-11-07T17:00:00+08:00').getTime();
  const START = new Date('2026-11-05T00:00:00+08:00').getTime();
  const PHT_OFFSET_MS = 8 * 3600 * 1000;
  const DAY_MS = 86400000;

  // #arrived jumps straight to the 5 PM screen. #soon plays the last 6 seconds of the countdown.
  const previewArrived = location.hash === '#arrived';
  const previewSoon = location.hash === '#soon';
  const loadedAt = Date.now();
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const now = () => {
    if (previewArrived) return TARGET;
    if (previewSoon) return TARGET - 6000 + (Date.now() - loadedAt);
    return Date.now();
  };
  const $ = (id) => document.getElementById(id);

  /* ---------- Countdown ---------- */

  function setNum(id, value) {
    const el = $(id);
    const text = String(value).padStart(2, '0');
    if (el.dataset.v === text) return;
    el.dataset.v = text;
    el.innerHTML = [...text].map((c) => '<i>' + c + '</i>').join('');
  }

  function setUnit(id, value, word) {
    setNum(id, value);
    $('label-' + id).textContent = value === 1 ? word : word + 's';
  }

  function sleepsLine(t) {
    const days = Math.floor((TARGET + PHT_OFFSET_MS) / DAY_MS) - Math.floor((t + PHT_OFFSET_MS) / DAY_MS);
    if (days <= 0) return 'Today!';
    return days === 1 ? '1 more sleep.' : days + ' more sleeps.';
  }

  let arrived = false;
  let ticker = null;

  function arrive() {
    arrived = true;
    if (ticker) clearInterval(ticker);
    document.title = 'Happy 1st Weeksary';
    document.body.classList.add('arrived');
    $('timer').hidden = true;
    $('local').hidden = true;
    $('headline').textContent = 'Happy 1st Weeksary';
    $('sleeps').textContent = 'Our first 7 days.';
    $('message').textContent = 'Come find me at the tent.';
    showPhotos();
    startFireworks();
  }

  /* ---------- Photos ---------- */

  const TILTS = [-1.2, 1.8, -1.6, 2, -2, 0.9, -1, 1.4];

  function showPhotos() {
    const box = $('photos');
    PHOTOS.forEach((p, i) => {
      const print = document.createElement('button');
      print.type = 'button';
      print.className = ('print ' + p.c).trim();
      print.style.setProperty('--tilt', TILTS[i % TILTS.length] + 'deg');
      print.style.setProperty('--delay', 0.6 + i * 0.25 + 's');
      print.setAttribute('aria-label', 'Enlarge: ' + p.a);
      const img = new Image();
      img.src = p.s;
      img.alt = p.a;
      print.append(img);
      print.addEventListener('click', () => {
        $('viewer-img').src = p.s;
        $('viewer-img').alt = p.a;
        $('viewer').showModal();
      });
      box.append(print);
    });
    box.hidden = false;
  }

  $('viewer').addEventListener('click', () => $('viewer').close());

  /* ---------- Fireworks ---------- */

  const SPARK_COLORS = ['#ffd27a', '#ff8f6b', '#ff6f91', '#fdf1dc', '#9db8ff', '#c9a0ff'];
  const GRAVITY = 0.12;
  const OPENING_MS = 12000;
  const SHOW_MS = 40000;

  function startFireworks() {
    const fx = $('sparks');
    fx.hidden = false;
    const c = fx.getContext('2d');
    const rockets = [];
    const sparks = [];
    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = () => SPARK_COLORS[Math.floor(Math.random() * SPARK_COLORS.length)];
    let w, h, reach, launched = 0;

    function size() {
      const scale = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      reach = Math.max(0.8, Math.min(1.5, Math.min(w, h) / 500));
      fx.width = Math.round(w * scale);
      fx.height = Math.round(h * scale);
      c.setTransform(scale, 0, 0, scale, 0, 0);
    }
    size();
    window.addEventListener('resize', size);

    function burst(x, y, heart) {
      const color = pick();
      const accent = pick();
      const count = sparks.length > 900 ? 50 : 120;
      for (let i = 0; i < count; i++) {
        let vx, vy;
        if (heart) {
          const t = (i / count) * Math.PI * 2;
          vx = (Math.pow(Math.sin(t), 3)) * 5.4 * reach;
          vy = -((13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16) * 5.4 * reach;
        } else {
          const angle = Math.random() * Math.PI * 2;
          const speed = rand(1.5, 7) * reach;
          vx = Math.cos(angle) * speed;
          vy = Math.sin(angle) * speed;
        }
        sparks.push({ x, y, vx, vy, life: 1, decay: rand(0.008, 0.014), color: heart ? '#ff6f91' : (i % 4 ? color : accent) });
      }
    }

    function launch() {
      const targetY = rand(0.12, 0.5) * h;
      launched++;
      rockets.push({ x: rand(0.12, 0.88) * w, y: h + 10, vy: -Math.sqrt(2 * GRAVITY * (h + 10 - targetY)), heart: launched % 4 === 0 });
    }

    function step(dt) {
      c.globalCompositeOperation = 'destination-out';
      c.fillStyle = 'rgba(0,0,0,' + (1 - Math.pow(0.88, dt)) + ')';
      c.fillRect(0, 0, w, h);
      c.globalCompositeOperation = 'source-over';
      c.lineCap = 'round';
      c.lineWidth = 2.4;

      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        const fromY = r.y;
        r.y += r.vy * dt;
        r.vy += GRAVITY * dt;
        c.strokeStyle = '#ffe9b8';
        c.globalAlpha = 1;
        c.beginPath();
        c.moveTo(r.x, fromY);
        c.lineTo(r.x, r.y);
        c.stroke();
        if (r.vy >= -0.4) {
          burst(r.x, r.y, r.heart);
          rockets.splice(i, 1);
        }
      }

      const drag = Math.pow(0.975, dt);
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        const fromX = s.x;
        const fromY = s.y;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.vx *= drag;
        s.vy = s.vy * drag + 0.03 * dt;
        s.life -= s.decay * dt;
        if (s.life <= 0) { sparks.splice(i, 1); continue; }
        c.globalAlpha = s.life;
        c.strokeStyle = s.color;
        c.beginPath();
        c.moveTo(fromX, fromY);
        c.lineTo(s.x, s.y);
        c.stroke();
      }
      c.globalAlpha = 1;
    }

    if (calm) {
      burst(w * 0.25, h * 0.25, false);
      burst(w * 0.72, h * 0.18, true);
      for (let i = 0; i < 24; i++) step(1);
      return;
    }

    $('hint').hidden = false;
    stage.addEventListener('pointerdown', (e) => {
      if (!e.target.closest('.print')) burst(e.clientX, e.clientY, Math.random() < 0.25);
    });

    const began = performance.now();
    let last = began;
    let nextLaunch = began;
    burst(w * 0.28, h * 0.22, false);
    burst(w * 0.72, h * 0.14, false);
    burst(w * 0.5, h * 0.42, true);
    launch();
    launch();
    const frame = (ts) => {
      const dt = Math.min(3, (ts - last) / 16.67);
      last = ts;
      if (ts >= nextLaunch && ts - began < SHOW_MS) {
        launch();
        nextLaunch = ts + (ts - began < OPENING_MS ? rand(280, 520) : rand(3000, 5500));
      }
      if (dt > 0) step(dt);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  function tick() {
    const t = now();
    const secs = Math.ceil((TARGET - t) / 1000);
    if (secs <= 0) { arrive(); return; }
    const d = Math.floor(secs / 86400);
    const h = Math.floor((secs % 86400) / 3600);
    const m = Math.floor((secs % 3600) / 60);
    $('unit-d').hidden = d === 0;
    setUnit('d', d, 'day');
    setUnit('h', h, 'hour');
    setUnit('m', m, 'minute');
    setUnit('s', secs % 60, 'second');
    $('sleeps').textContent = sleepsLine(t);
    $('timer').setAttribute('aria-label', d + ' days, ' + h + ' hours and ' + m + ' minutes left');
  }

  if (new Date(TARGET).getTimezoneOffset() !== -480) {
    const local = new Intl.DateTimeFormat(undefined, { weekday: 'long', hour: 'numeric', minute: '2-digit' }).format(TARGET);
    $('local').textContent = "That's " + local + ' where you are.';
    $('local').hidden = false;
  }

  /* ---------- Campsite scene ---------- */

  const stage = $('stage');
  const copy = $('copy');
  const canvas = $('scene');
  const ctx = canvas.getContext('2d');
  let back, W, H, S, dpr, tx, ty, th, tw, trailL, trailR, twinkles, flies, bulbs;

  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function ridge(c, base, amp, seed, fill) {
    const r = rng(seed);
    const a = r() * 6.28, b = r() * 6.28, k = r() * 6.28;
    const y = (x) => base + amp * (Math.sin(x * 0.004 + a) * 0.6 + Math.sin(x * 0.011 + b) * 0.3 + Math.sin(x * 0.027 + k) * 0.1);
    c.beginPath();
    c.moveTo(0, H);
    for (let x = 0; x <= W + 8; x += 8) c.lineTo(x, y(x));
    c.lineTo(W + 8, H);
    c.closePath();
    c.fillStyle = fill;
    c.fill();
    return y;
  }

  function pine(c, x, y, h, fill) {
    c.fillStyle = fill;
    for (let i = 0; i < 3; i++) {
      const top = y - h + (i * h) / 4;
      const half = (h * (0.16 + i * 0.07));
      c.beginPath();
      c.moveTo(x, top);
      c.lineTo(x + half, top + h * 0.48);
      c.lineTo(x - half, top + h * 0.48);
      c.closePath();
      c.fill();
    }
  }

  function drawTent(c) {
    const r = tw / 2;
    const eaveY = ty - th * 0.3;
    const apexY = ty - th;

    c.strokeStyle = 'rgba(253,241,220,.28)';
    c.lineWidth = 1;
    [[-1], [1]].forEach(([side]) => {
      c.beginPath();
      c.moveTo(tx + side * r, eaveY);
      c.lineTo(tx + side * r * 1.42, ty + th * 0.05);
      c.stroke();
    });

    const body = c.createRadialGradient(tx, ty - th * 0.18, th * 0.08, tx, ty - th * 0.18, th * 1.05);
    body.addColorStop(0, '#ffdb98');
    body.addColorStop(0.55, '#d78f54');
    body.addColorStop(1, '#6e4352');
    c.beginPath();
    c.moveTo(tx, apexY);
    c.quadraticCurveTo(tx + r * 0.38, eaveY - th * 0.12, tx + r, eaveY);
    c.lineTo(tx + r * 1.02, ty);
    c.lineTo(tx - r * 1.02, ty);
    c.lineTo(tx - r, eaveY);
    c.quadraticCurveTo(tx - r * 0.38, eaveY - th * 0.12, tx, apexY);
    c.closePath();
    c.fillStyle = body;
    c.fill();

    c.strokeStyle = 'rgba(70,35,45,.32)';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(tx - r, eaveY);
    c.quadraticCurveTo(tx, eaveY + th * 0.09, tx + r, eaveY);
    [-0.55, 0.55].forEach((f) => {
      c.moveTo(tx, apexY);
      c.quadraticCurveTo(tx + r * f * 0.5, eaveY - th * 0.1, tx + r * f, eaveY + th * 0.06);
    });
    c.stroke();

    const dw = th * 0.2;
    const door = c.createLinearGradient(0, ty - th * 0.62, 0, ty);
    door.addColorStop(0, '#ffb95e');
    door.addColorStop(1, '#fff1c7');
    c.beginPath();
    c.moveTo(tx, ty - th * 0.62);
    c.lineTo(tx + dw, ty);
    c.lineTo(tx - dw, ty);
    c.closePath();
    c.fillStyle = door;
    c.fill();
    c.fillStyle = 'rgba(110,62,58,.55)';
    [-1, 1].forEach((side) => {
      c.beginPath();
      c.moveTo(tx, ty - th * 0.62);
      c.lineTo(tx + side * dw * 1.5, ty);
      c.lineTo(tx + side * dw, ty);
      c.closePath();
      c.fill();
    });

    c.strokeStyle = '#2a1f33';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(tx, apexY);
    c.lineTo(tx, apexY - th * 0.1);
    c.stroke();
    c.fillStyle = '#f0955a';
    c.beginPath();
    c.moveTo(tx, apexY - th * 0.1);
    c.lineTo(tx + th * 0.09, apexY - th * 0.07);
    c.lineTo(tx, apexY - th * 0.04);
    c.closePath();
    c.fill();
  }

  function bezier(p, t) {
    const u = 1 - t;
    return {
      x: u * u * u * p[0].x + 3 * u * u * t * p[1].x + 3 * u * t * t * p[2].x + t * t * t * p[3].x,
      y: u * u * u * p[0].y + 3 * u * u * t * p[1].y + 3 * u * t * t * p[2].y + t * t * t * p[3].y,
    };
  }

  function tracePath(c, p, upto) {
    c.beginPath();
    const steps = 60;
    for (let i = 0; i <= steps; i++) {
      const q = bezier(p, (i / steps) * upto);
      if (i === 0) c.moveTo(q.x, q.y); else c.lineTo(q.x, q.y);
    }
  }

  function build() {
    W = stage.clientWidth;
    H = stage.clientHeight;
    if (!W || !H) return;
    S = parseFloat(getComputedStyle(copy).paddingBottom);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);

    back = document.createElement('canvas');
    back.width = canvas.width;
    back.height = canvas.height;
    const c = back.getContext('2d');
    c.scale(dpr, dpr);

    const skyEnd = H - S * 0.5;
    const sky = c.createLinearGradient(0, 0, 0, skyEnd);
    const edge = Math.max(0, (H - S) / skyEnd);
    sky.addColorStop(0, '#10162f');
    sky.addColorStop(edge * 0.6, '#262451');
    sky.addColorStop(edge, '#4a3468');
    sky.addColorStop(edge + (1 - edge) * 0.4, '#b85c6e');
    sky.addColorStop(1, '#f6a45e');
    c.fillStyle = sky;
    c.fillRect(0, 0, W, H);

    const r = rng(7);
    const starCount = Math.round((W * (H - S)) / 3200);
    for (let i = 0; i < starCount; i++) {
      const y = r() * (H - S * 0.9);
      const fade = 1 - y / (H - S * 0.9);
      c.fillStyle = 'rgba(253,241,220,' + (0.15 + r() * 0.6) * fade + ')';
      c.beginPath();
      c.arc(r() * W, y, 0.4 + r() * 0.8, 0, 6.3);
      c.fill();
    }
    twinkles = Array.from({ length: Math.min(36, Math.round(starCount / 5)) }, () => {
      const y = r() * (H - S);
      return { x: r() * W, y, size: 0.7 + r() * 0.9, phase: r() * 6.28, speed: 0.4 + r() * 1.1, fade: 1 - y / (H - S * 0.9) };
    });

    const sunX = W * 0.82;
    const sun = c.createRadialGradient(sunX, H - S * 0.62, 0, sunX, H - S * 0.62, S * 0.7);
    sun.addColorStop(0, 'rgba(255,214,140,.75)');
    sun.addColorStop(1, 'rgba(255,214,140,0)');
    c.fillStyle = sun;
    c.fillRect(0, 0, W, H);

    ridge(c, H - S * 0.66, S * 0.09, 11, '#71466f');
    const mid = ridge(c, H - S * 0.52, S * 0.07, 23, '#352a58');
    const tr = rng(31);
    for (let x = -10; x < W + 10; x += 12 + tr() * 30) {
      pine(c, x, mid(x) + 4, S * (0.07 + tr() * 0.09), '#2a2450');
    }

    const groundFill = c.createLinearGradient(0, H - S * 0.42, 0, H);
    groundFill.addColorStop(0, '#20224a');
    groundFill.addColorStop(1, '#0f1428');
    ridge(c, H - S * 0.4, S * 0.03, 47, groundFill);

    tx = W * (W > 800 ? 0.62 : 0.5);
    ty = H - S * 0.2;
    th = Math.min(S * 0.42, W * 0.3);
    tw = th * 1.5;

    trailL = [
      { x: -10, y: H - S * 0.28 },
      { x: tx * 0.38, y: H - S * 0.28 },
      { x: tx * 0.7, y: H },
      { x: tx - th * 0.05, y: ty + 3 },
    ];
    trailR = [
      { x: W + 10, y: H - S * 0.3 },
      { x: tx + (W - tx) * 0.62, y: H - S * 0.28 },
      { x: tx + (W - tx) * 0.3, y: H - S * 0.01 },
      { x: tx + th * 0.05, y: ty + 3 },
    ];
    c.setLineDash([2, 8]);
    c.lineCap = 'round';
    c.lineWidth = 2;
    c.strokeStyle = 'rgba(253,241,220,.24)';
    [trailL, trailR].forEach((p) => { tracePath(c, p, 1); c.stroke(); });
    c.setLineDash([]);

    drawTent(c);

    // String lights run from the tent's shoulder to a post on its right.
    const postX = Math.min(tx + tw / 2 + th * 0.85, W - 8);
    const postTop = ty - th * 0.68;
    const eave = { x: tx + tw / 2, y: ty - th * 0.3 };
    c.strokeStyle = '#2a1f33';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(postX, ty + 2);
    c.lineTo(postX, postTop);
    c.stroke();
    const sagX = (eave.x + postX) / 2;
    const sagY = Math.max(eave.y, postTop) + th * 0.12;
    c.strokeStyle = 'rgba(253,241,220,.35)';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(eave.x, eave.y);
    c.quadraticCurveTo(sagX, sagY, postX, postTop);
    c.stroke();
    bulbs = [];
    for (let i = 1; i < 7; i++) {
      const t = i / 7, u = 1 - t;
      bulbs.push({
        x: u * u * eave.x + 2 * u * t * sagX + t * t * postX,
        y: u * u * eave.y + 2 * u * t * sagY + t * t * postTop + 2,
        phase: i * 1.7,
      });
    }

    const fr = rng(59);
    flies = Array.from({ length: 12 }, () => ({
      x: fr() * W,
      y: H - S * (0.05 + fr() * 0.42),
      phase: fr() * 6.28,
      speed: 0.25 + fr() * 0.4,
    }));
  }

  function lanternGlow(x, y, radius, alpha) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
    g.addColorStop(0, 'rgba(255,210,122,' + alpha + ')');
    g.addColorStop(1, 'rgba(255,210,122,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, 6.3);
    ctx.fill();
  }

  function drawLantern(p, label, flicker) {
    const x = p.x, y = p.y - 6;
    lanternGlow(x, y, 30 + flicker * 4, 0.7);
    ctx.fillStyle = '#fff3c9';
    ctx.beginPath();
    ctx.arc(x, y, 3.6, 0, 6.3);
    ctx.fill();
    if (label) {
      ctx.font = '24px "Nanum Pen Script", "Segoe Print", cursive';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fdf1dc';
      ctx.fillText(label, Math.max(22, Math.min(W - 22, x)), y - 14);
    }
  }

  function draw(ms) {
    if (!back) return;
    const sec = ms / 1000;
    const prog = Math.max(0, Math.min(1, (now() - START) / (TARGET - START)));
    // The trail starts just off-screen, so lanterns begin a little way in where they can be seen.
    const along = 0.07 + 0.93 * prog;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.drawImage(back, 0, 0, W, H);

    twinkles.forEach((s) => {
      const a = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(sec * s.speed + s.phase))) * Math.max(0, s.fade);
      ctx.fillStyle = 'rgba(255,246,226,' + a + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, 6.3);
      ctx.fill();
    });

    ctx.setLineDash([2, 8]);
    ctx.lineCap = 'round';
    ctx.lineWidth = 2.4;
    ctx.strokeStyle = 'rgba(255,210,122,.9)';
    [trailL, trailR].forEach((p) => { tracePath(ctx, p, along); ctx.stroke(); });
    ctx.setLineDash([]);

    ctx.globalCompositeOperation = 'lighter';
    const breathe = 1 + 0.03 * Math.sin(sec * 1.3);
    lanternGlow(tx, ty - th * 0.22, th * (arrived ? 2 : 1.45) * breathe, arrived ? 0.5 : 0.3);
    bulbs.forEach((b) => lanternGlow(b.x, b.y, 8, 0.55 + 0.2 * Math.sin(sec * 1.1 + b.phase)));
    ctx.globalCompositeOperation = 'source-over';
    bulbs.forEach((b) => {
      ctx.fillStyle = '#fff0c4';
      ctx.beginPath();
      ctx.arc(b.x, b.y, 1.8, 0, 6.3);
      ctx.fill();
    });

    flies.forEach((f) => {
      const a = Math.max(0, Math.sin(sec * f.speed * 2 + f.phase));
      const x = f.x + Math.sin(sec * f.speed + f.phase) * 18;
      const y = f.y + Math.cos(sec * f.speed * 0.8 + f.phase) * 8;
      lanternGlow(x, y, 6, 0.6 * a);
    });

    const flicker = Math.sin(sec * 7) * 0.5 + Math.sin(sec * 11.3) * 0.5;
    const showLabels = prog < 0.96;
    drawLantern(bezier(trailL, along), showLabels ? 'me' : '', flicker);
    drawLantern(bezier(trailR, along), showLabels ? 'you' : '', -flicker);
  }

  build();
  draw(0);
  new ResizeObserver(() => { build(); draw(performance.now()); }).observe(stage);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => draw(performance.now()));

  if (calm) {
    setInterval(() => draw(0), 60000);
  } else {
    let last = 0;
    const frame = (ts) => {
      if (ts - last > 33) { last = ts; draw(ts); }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  tick();
  if (!arrived) ticker = setInterval(tick, 250);
})();
</script>
